name: Build Godot Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.4.1 and web templates
        run: |
          set -eux
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Import assets
        run: /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Export browser build
        run: |
          mkdir -p build/web
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: NexTgenLeo-Web
          path: build/web/
          if-no-files-found: error
