name: Deploy NexTgenLeo Web
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and templates
        run: |
          set -eux
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test authoritative server
        run: |
          pip install -r server/requirements.txt
          cd server
          python -m unittest -v
      - name: Validate and export game
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
        run: |
          bash tools/check_godot.sh
          python tools/test_network.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser acceptance (Chromium desktop and touch emulation)
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/browser_test.cjs
      - name: Publish verified UI previews with the playable Web export
        run: |
          test -s build/leo-desktop.png
          test -s build/leo-portrait.png
          cp build/leo-desktop.png build/web/ui-landscape-preview.png
          cp build/leo-portrait.png build/web/ui-portrait-preview.png
          test -s build/leo-portrait-bag.png
          cp build/leo-portrait-bag.png build/web/ui-portrait-bag-preview.png
          test -s build/leo-inventory-extension-desktop.png
          cp build/leo-inventory-extension-desktop.png build/web/ui-inventory-extension-preview.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Browser-QA
          path: build/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: NexTgenLeo-Web
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web
  publish:
    if: github.event_name != 'pull_request'
    needs: deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  # Keep branch-source Pages working even when GitHub's implicit Jekyll
  # build supersedes the Actions deployment. Never publish untested PRs.
  mirror:
    name: Mirror verified web export to main for Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: NexTgenLeo-Web
          path: _pages_export
      - name: Verify and publish static Godot export
        shell: bash
        run: |
          set -euo pipefail
          test -s _pages_export/index.html
          # Upload-artifact excludes dotfiles by default; recreate the marker.
          touch _pages_export/.nojekyll
          # Do not overwrite a newer source revision with a stale export.
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skipping this older export."
            exit 0
          fi
          while IFS= read -r -d '' source_file; do
            destination="${source_file#_pages_export/}"
            mkdir -p "$(dirname "$destination")"
            cp -f "$source_file" "$destination"
            git add -f -- "$destination"
          done < <(find _pages_export -type f -print0)
          if git diff --cached --quiet; then
            echo "Published web export is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish playable Godot web export [skip ci]"
          git push origin HEAD:main
