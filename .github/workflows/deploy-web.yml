name: Deploy NexTgenLeo Web
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and templates
        run: |
          set -eux
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test authoritative server
        run: |
          pip install -r server/requirements.txt
          cd server
          python -m unittest -v
      - name: Validate and export game
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
        run: |
          bash tools/check_godot.sh
          python tools/test_network.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser acceptance (Chromium desktop and touch emulation)
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/browser_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Browser-QA
          path: build/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: NexTgenLeo-Web
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web
  publish:
    if: github.event_name != 'pull_request'
    needs: deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Use Actions as the Pages publishing source
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('PUT /repos/{owner}/{repo}/pages', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              build_type: 'workflow'
            });
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
