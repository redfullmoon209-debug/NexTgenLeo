name: Godot 4.4.1 Web Export

on:
  push:
    branches:
      - godot/3d-browser-playtest
    paths:
      - project.godot
      - export_presets.cfg
      - godot_src/**
      - assets/models/**
      - .github/workflows/godot-web.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-web-playtest
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Godot source branch
        uses: actions/checkout@v4
      - name: Install Godot 4.4.1 and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 755 /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          godot --headless --version
      - name: Import models and export Web
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit
          mkdir -p build/godot-playtest
          godot --headless --path . --export-release Web build/godot-playtest/index.html
          test -s build/godot-playtest/index.html
          test -s build/godot-playtest/index.wasm
      - name: Upload playable Web export
        uses: actions/upload-artifact@v4
        with:
          name: NexTgenLeo-Godot-Web
          path: build/godot-playtest/
          if-no-files-found: error
      - name: Publish to isolated Pages subdirectory on main
        if: github.ref == 'refs/heads/godot/3d-browser-playtest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/godot-pages-main
          mkdir -p /tmp/godot-pages-main/godot-playtest
          find /tmp/godot-pages-main/godot-playtest -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a build/godot-playtest/. /tmp/godot-pages-main/godot-playtest/
          touch /tmp/godot-pages-main/.nojekyll
          cd /tmp/godot-pages-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot-playtest .nojekyll
          if git diff --cached --quiet; then
            echo "No exported changes"
          else
            git commit -m "Publish isolated Godot 3D browser playtest [skip ci]"
            git push origin main
          fi
