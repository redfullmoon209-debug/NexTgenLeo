name: Godot 3D Web Preview

on:
  push:
    branches: [godot-thailand-3d]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-web-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-build
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import Godot assets
        run: |
          cd godot
          godot --headless --editor --path . --import
      - name: Export HTML5
        run: |
          mkdir -p web-build
          cd godot
          godot --headless --path . --export-release "Web" ../web-build/index.html
      - name: Verify web build
        run: test -s web-build/index.html
      - name: Upload web export artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexTgenLeo-godot-web
          path: web-build/
